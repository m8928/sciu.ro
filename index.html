<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0D10" />
  <meta name="description" content="Sciuro builds Rust-native software for log ingestion, search, and alerting." />
  <title>Sciuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&amp;display=swap"
    rel="stylesheet"
  />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #0a0d10;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      overflow: hidden;
      font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    }

    img {
      width: min(180px, 46vw);
      height: auto;
      display: block;
      margin-bottom: 6px;
    }

    p {
      margin: 0;
      color: #838c95;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
    }

    .description {
      max-width: min(440px, 80vw);
      color: #aab4bc;
      text-align: center;
    }

    a {
      color: #aab4bc;
      font-size: 13px;
      text-underline-offset: 4px;
    }

    a:focus-visible {
      outline: 2px solid #0ea397;
      outline-offset: 5px;
    }
  </style>
</head>
<body>
  <img src="sciuro-wordmark-dark.svg" alt="Sciuro" />
  <p>Grounded operations.</p>
  <p class="description">Rust-native log ingestion, search, and alerting.</p>
  <a href="mailto:sciuro@sciu.ro">sciuro@sciu.ro</a>
</body>
</html>
