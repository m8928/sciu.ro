<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0D10" />
  <meta name="description" content="Sciuro is a self-hosted Rust log platform with HEC-compatible and syslog ingestion, SPL-style search, scheduled searches, and alerts." />
  <title>Sciuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&amp;display=swap"
    rel="stylesheet"
  />
  <style>
    html { background: #0a0d10; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #0a0d10;
      color: #eef2f3;
      font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(100% - 40px, 920px);
      margin: 0 auto;
      padding: 36px 0 34px;
      text-align: center;
    }

    .wordmark { display: block; width: min(180px, 46vw); height: auto; margin: 0 auto; }

    p {
      margin: 0;
      color: #838c95;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .tagline { margin-top: 14px; }

    .description {
      max-width: 600px;
      margin: 22px auto 0;
      color: #aab4bc;
      line-height: 1.65;
    }

    figure { margin: 30px 0 0; }

    .preview-image {
      display: block;
      overflow: hidden;
      border: 1px solid #303941;
      border-radius: 8px;
      background: #1c1c22;
    }

    .preview-image img { display: block; width: 100%; height: auto; }

    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      color: #838c95;
      font-size: 12px;
      line-height: 1.5;
    }

    .contact { display: inline-block; margin-top: 24px; }

    a { color: #aab4bc; text-underline-offset: 4px; }

    a:focus-visible { outline: 2px solid #0ea397; outline-offset: 5px; }

    @media (max-width: 640px) {
      main { width: min(100% - 28px, 920px); padding: 42px 0 36px; }
      .description { margin-top: 20px; }
      figure { margin-top: 34px; }
      figcaption { flex-direction: column; align-items: center; gap: 2px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="wordmark" src="sciuro-wordmark-dark.svg" alt="Sciuro" />
    <p class="tagline">Grounded operations.</p>
    <p class="description">Sciuro is a self-hosted log platform built in Rust. It ingests logs through HEC-compatible HTTP, syslog, and file inputs, runs SPL-style searches, and supports scheduled searches and alerts.</p>

    <figure>
      <a class="preview-image" href="assets/search-ui-sample.jpg" target="_blank" rel="noopener" aria-label="Open Sciuro Search UI design preview at full size">
        <img src="assets/search-ui-sample.jpg" width="1280" height="560" alt="Sciuro Search UI showing a statistics table with sample data" />
      </a>
      <figcaption>
        <span>Search UI design preview · sample data</span>
        <span>Open image for full size</span>
      </figcaption>
    </figure>

    <a class="contact" href="mailto:sciuro@sciu.ro">sciuro@sciu.ro</a>
  </main>
</body>
</html>
